name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1   # production runs Node 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # The reviews.* capabilities and the reviews service manifest are proposals (docs/) until the
      # lead releases them in OpenVibe.Contracts; until then this check is expected to fail.
      - run: npx openvibe-contracts-check --service reviews --src server
